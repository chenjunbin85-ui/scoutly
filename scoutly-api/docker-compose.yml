version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://threadscout:threadscout@db:5432/threadscout
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://threadscout:threadscout@db:5432/threadscout
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=2

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=threadscout
      - POSTGRES_PASSWORD=threadscout
      - POSTGRES_DB=threadscout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
